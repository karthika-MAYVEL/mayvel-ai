# config/field_aliases.yaml
# LLM field-name correction map used by core/query_assembler.py before pipeline execution.
# When the LLM generates a wrong field name in a $match stage, the assembler rewrites it
# to the correct DB field name automatically.
#
# Format: wrong_name: correct_name
# Add new entries here whenever a new LLM field-name mistake is discovered.
# No code changes required — just restart the service.

field_aliases:
  entityType:  type      # LLM hallucinates "entityType" — correct DB field is "type"
  entity_type: type      # snake_case variant of the same mistake
