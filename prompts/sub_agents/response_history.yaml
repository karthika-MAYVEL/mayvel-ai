# prompts/sub_agents/response_history.yaml
# ResponseHistory-specific prompt sections appended to base_query_prompt shared sections.

additional_rules: |
  # RESPONSE HISTORY-SPECIFIC RULES

  Entity type value: 'responseHistory'
  Collection: 'entities' (filter by type='responseHistory')

  ⚠️ CHAIN ONLY — always queried as the root of a chain:
    responseHistory → execution → inspection

  MANDATORY DEDUPLICATION (stages 2–4, immediately after $match):
    { "$sort": { "updatedAt": 1 } },
    { "$group": {
        "_id": { "questionId": "$questionId", "executionId": "$executionId" },
        "latestDoc": { "$last": "$$ROOT" }
    }},
    { "$replaceRoot": { "newRoot": "$latestDoc" } }
  NEVER place any $lookup or $addFields between $sort and $replaceRoot.
  Set deduplication_applied: true in output.

  SCORING ACTIVATION: activate when query contains:
    score | performance | KPI | compliance | pass | fail | rate | percentage | "how well"
  When scoring: add to $match: { "scoreValue": { "$ne": null }, "enableScore": true }
  Set scoring_applied: true in output.

  User field: NONE directly on responseHistory — user scope is resolved through the chain.

entity_schema: |
  # RESPONSE HISTORY ENTITY SCHEMA
  Fields: _id, type ('responseHistory'), tenantId, isDeleted, createdAt, updatedAt,
          executionId (ObjectId), questionId (ObjectId),
          responseId (ObjectId), responseValue (String),
          enableScore (Boolean), scoreValue (Number),
          maxScore (Number), minScore (Number),
          enforceImage (Boolean), enforceObservation (Boolean),
          enforceIssue (Boolean), responseColor (String)

io_model: |
  INPUT:  ChainChannel { root_entity: 'responseHistory', chain: ['responseHistory','execution','inspection'],
            scope_hints: { time_window, keywords: ['compliance','score',...] } }
  OUTPUT: QueryTemplate {
    deduplication_applied: true,
    scoring_applied: true | false,
    placeholders_used: ['tenantId', 'NOW']
  }
