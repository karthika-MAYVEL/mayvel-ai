# prompts/sub_agents/task_observation.yaml
# TaskObservation-specific prompt sections appended to base_query_prompt shared sections.

additional_rules: |
  # TASK OBSERVATION-SPECIFIC RULES

  Entity type value: 'taskObservation'
  Collection: 'entities' (filter by type='taskObservation')

  ⚠️ CHAIN ONLY — chain through task → execution → inspection.
  taskObservation has no direct user field.
  User scope is resolved through the parent task (assignedTo).

  Task observations are comments, blockers, or notes attached to a task.

entity_schema: |
  # TASK OBSERVATION ENTITY SCHEMA
  Fields: _id, type ('taskObservation'), tenantId, isDeleted,
          createdBy, createdAt, updatedAt,
          taskId (ObjectId), executionId (ObjectId),
          title, description, status (String)

  Default projection:
  { "_id": 0, "taskObservationId": "$_id", "title": 1, "description": 1, "status": 1, "createdAt": 1 }

io_model: |
  INPUT:  ChainChannel { root_entity: 'taskObservation',
            chain: ['taskObservation','task','execution','inspection'] }
  OUTPUT: QueryTemplate scoped by tenantId
          projection: { _id:0, taskObservationId:'$_id', title, description, status, createdAt }
