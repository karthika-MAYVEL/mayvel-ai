# prompts/sub_agents/groups/template.yaml
# T2 · TEMPLATE Group — entity schemas for the content-definition layer.
# Entities: checklist, section, question, responseValues
# Loaded by TemplateGroupAgent after shared_base sections.

group: TEMPLATE
entities:
  - checklist
  - section
  - question
  - responseValues

group_rules: |-
  # T2 · TEMPLATE GROUP — AGENT SCOPE

  This agent handles all queries about the **content definition layer** —
  checklists (reusable audit templates), their sections, questions, and
  the predefined answer options (responseValues). These entities are authored
  and configured. They are NOT executed or assigned.

  ## Entity Hierarchy
  checklist → section → question → responseValues

  ## User Field Rules
  | Entity          | User field           |
  |-----------------|----------------------|
  | checklist       | createdBy ONLY       |
  | section         | none (tenant-wide)   |
  | question        | none (tenant-wide)   |
  | responseValues  | none (tenant-wide)   |

  ⚠️ checklist has NO assignedTo field. NEVER filter checklist by assignedTo.
  ⚠️ No status field, no scheduleDate on any TEMPLATE entity.

entity_schemas: |-
  # ENTITY SCHEMAS — TEMPLATE GROUP

  ## checklist
  A reusable audit template authored by a user.
  User field: createdBy ⭐

  Fields: _id · type('checklist') · tenantId · isDeleted · createdBy ⭐ ·
          createdAt · updatedAt · title · description · tags(Array) ·
          isLibrary(Boolean) · isTemplate(Boolean) · isLatest(Boolean) ·
          orderNumber(Number)

  Default projection:
  { "_id": 0, "checklistId": "$_id", "title": 1, "description": 1, "isLibrary": 1, "createdAt": 1 }

  ---

  ## section
  A grouping of questions within a checklist.
  No user field — scope via checklist.createdBy.

  Fields: _id · type('section') · tenantId · isDeleted · createdAt · updatedAt ·
          checklistId(ObjectId → checklist._id) · title · orderNumber(Number)

  Default projection:
  { "_id": 0, "sectionId": "$_id", "title": 1, "checklistId": 1, "orderNumber": 1, "createdAt": 1 }

  ---

  ## question
  A single question within a section.
  No user field — scope via checklist.createdBy.

  Fields: _id · type('question') · tenantId · isDeleted · createdAt · updatedAt ·
          checklistId(ObjectId → checklist._id) · sectionId(ObjectId → section._id) ·
          title · questionType(String) · isMandatory(Boolean) · orderNumber(Number) ·
          enableScore(Boolean) · maxScore(Number)

  Default projection:
  { "_id": 0, "questionId": "$_id", "title": 1, "questionType": 1, "isMandatory": 1, "sectionId": 1, "createdAt": 1 }

  ---

  ## responseValues
  Predefined answer options for a question.
  No user field — tenant-wide.

  Fields: _id · type('responseValues') · tenantId · isDeleted · createdAt · updatedAt ·
          questionId(ObjectId → question._id) · value(String) · scoreValue(Number) ·
          color(String) · isDefault(Boolean)

  Default projection:
  { "_id": 0, "responseValueId": "$_id", "value": 1, "scoreValue": 1, "questionId": 1, "createdAt": 1 }

relationships: |-
  # RELATIONSHIPS — TEMPLATE GROUP

  checklist._id ← section.checklistId     (scalar $eq)
  checklist._id ← question.checklistId    (scalar $eq)
  section._id   ← question.sectionId      (scalar $eq)
  question._id  ← responseValues.questionId (scalar $eq)

common_mistakes: |-
  # COMMON MISTAKES TO AVOID — TEMPLATE GROUP

  ✗ Adding assignedTo filter to checklist — use createdBy only
  ✗ Using status or scheduleDate on any TEMPLATE entity — these fields do not exist
  ✗ Querying section/question by user — they have no user field; scope through checklist
  ✗ Cross-querying into SCHEDULING or EXECUTION entities from this group

query_examples:
  - query: "Show all my checklists"
    pipeline: >
      find({ type:"checklist", tenantId:"{tenantId}", createdBy:"{userId}", isDeleted:false })

  - query: "How many questions does checklist X have?"
    pipeline: >
      aggregate: $match(question, checklistId=$lookup result) → $count

  - query: "List response options for question Y"
    pipeline: >
      aggregate: $match(responseValues, questionId={questionId}) → $project
