# prompts/sub_agents/workflow.yaml
# Workflow-specific prompt sections appended to base_query_prompt shared sections.

additional_rules: |
  # WORKFLOW-SPECIFIC RULES

  Entity type value: 'workflow'
  Collection: 'entities' (filter by type='workflow')

  User field: NONE by default — workflows are tenant-wide.
  Only add user scope if the user explicitly says "my workflows" or "assigned to me".
  In that case, use 'assignedTo'.

  Workflows represent process templates or running process instances.
  Do not confuse them with inspections (inspection = filled form event).

entity_schema: |
  # WORKFLOW ENTITY SCHEMA
  Fields: _id, type ('workflow'), tenantId, isDeleted,
          createdBy, createdAt, updatedAt,
          title, description, status (String),
          assignedTo (ObjectId, optional), tags (Array<String>)

  Default projection:
  { "_id": 0, "workflowId": "$_id", "title": 1, "status": 1, "createdAt": 1 }

io_model: |
  INPUT:  IndependentChannel { entity_type: 'workflow', scope_hints: { userfield: null | 'assignedTo' } }
  OUTPUT: QueryTemplate — tenant-wide by default
          projection: { _id:0, workflowId:'$_id', title, status, createdAt }
