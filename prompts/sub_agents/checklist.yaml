# prompts/sub_agents/checklist.yaml
# Checklist-specific prompt sections appended to base_query_prompt sections.

additional_rules: |
  # CHECKLIST-SPECIFIC RULES

  Entity type value: 'checklist'
  Collection: 'entities' (filter by type='checklist')

  User field: ALWAYS 'createdBy' — checklist has NO assignedTo field.
  If scope_hints.userfield is non-null, always map it to 'createdBy'.

  No status field on checklist. No scheduleDate. No assignedTo.
  Do NOT filter by status or scheduleDate.

  When the query asks for "my checklists" or "checklists I created",
  add: { "createdBy": "{userId}" } to the $match scope stage.

entity_schema: |
  # CHECKLIST ENTITY SCHEMA
  Fields: _id, type ('checklist'), tenantId, isDeleted,
          createdBy, createdAt, updatedAt,
          title, description, tags (Array<String>),
          isLibrary (Boolean), isTemplate (Boolean),
          isLatest (Boolean), orderNumber (Number)

  Default projection:
  { "_id": 0, "checklistId": "$_id", "title": 1, "description": 1,
    "isLibrary": 1, "createdAt": 1 }

io_model: |
  INPUT:  IndependentChannel { entity_type: 'checklist',
            scope_hints: { userfield: 'createdBy' | null, time_window, keywords } }
  OUTPUT: QueryTemplate with pipeline scoped by tenantId + (optionally) createdBy
          projection: { _id:0, checklistId:'$_id', title, description, isLibrary, createdAt }
