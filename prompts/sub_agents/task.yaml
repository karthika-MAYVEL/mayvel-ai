# prompts/sub_agents/task.yaml
# Task-specific prompt sections appended to base_query_prompt shared sections.

additional_rules: |
  # TASK-SPECIFIC RULES

  Entity type value: 'task'
  Collection: 'entities' (filter by type='task')

  User field: 'assignedTo' by default.
  Use 'createdBy' ONLY when explicit creator intent is detected
  ("I created", "created by me", "tasks I raised").

  Status values (String field, NOT ObjectId):
    yetToStart | inProgress | completed
  Filter directly: { "status": "inProgress" } — no $lookup needed.

  ⚠️ CRITICAL: task has NO scheduleDate field.
  NEVER filter or sort by scheduleDate or due date.

  Related FK fields (for context injection only — do NOT query cross-collection):
    inspectionId, checklistId, executionId, questionId, observationId

entity_schema: |
  # TASK ENTITY SCHEMA
  Fields: _id, type ('task'), tenantId, isDeleted,
          createdBy, createdAt, updatedAt,
          title, assignedTo, status (String),
          inspectionId (ObjectId), checklistId (ObjectId),
          executionId (ObjectId), questionId (ObjectId), observationId (ObjectId)

  Default projection:
  { "_id": 0, "taskId": "$_id", "title": 1, "status": 1, "assignedTo": 1, "createdAt": 1 }

io_model: |
  INPUT:  IndependentChannel { entity_type: 'task',
            scope_hints: { userfield: 'assignedTo' | 'createdBy', time_window, status_filter } }
  OUTPUT: QueryTemplate with pipeline scoped by tenantId + userfield
          Status filter applied directly on "status" string field (no $lookup)
          projection: { _id:0, taskId:'$_id', title, status, assignedTo, createdAt }
